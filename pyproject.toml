[project]
name = "knowledge-ingestion"
version = "0.1.0"
description = "Agentic knowledge ingestion and question bank system"
requires-python = ">=3.12"

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "markdown>=3.6",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "rich>=13.0",
    "typer>=0.12",
    "openai>=3.15.0",
    "openai-agents>=0.22.3",
]

[project.scripts]
ingest = "knowledge_engine.pipeline:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
